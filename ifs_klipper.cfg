# Flashforge IFS (Intelligent Filament System) Klipper MCU Configuration
# MCU: N32G45x connected to AD5X host on /dev/ttyS4

[mcu ifs]
serial: /dev/ttyS4
baud: 230400
restart_method: command

[static_digital_output ifs_power]
pins: ifs:PB5, !ifs:PB6

# --- Stepper Motors ---

# Feeder Motor (Direct drive gear for pushing/pulling filament)
[manual_stepper ifs_feeder]
step_pin: ifs:PA0
dir_pin: ifs:PA1
enable_pin: !ifs:PA5
microsteps: 16
rotation_distance: 22.5
velocity: 50
accel: 500

# Selector Motor (Channel selector positioning)
[manual_stepper ifs_selector]
step_pin: ifs:PA6
dir_pin: ifs:PA7
enable_pin: !ifs:PB1
endstop_pin: ^ifs:PB9
microsteps: 16
rotation_distance: 40
velocity: 25
accel: 200

# --- Filament Presence Sensors ---

[filament_switch_sensor ifs_spool_1]
switch_pin: ^!ifs:PC0
pause_on_runout: False

[filament_switch_sensor ifs_spool_2]
switch_pin: ^!ifs:PC2
pause_on_runout: False

[filament_switch_sensor ifs_spool_3]
switch_pin: ^!ifs:PB12
pause_on_runout: False

[filament_switch_sensor ifs_spool_4]
switch_pin: ^!ifs:PB14
pause_on_runout: False
