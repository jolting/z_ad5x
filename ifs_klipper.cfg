# Flashforge IFS (Intelligent Filament System) Klipper MCU Configuration
# MCU: N32G45x connected to AD5X host on /dev/ttyS4

[mcu ifs]
serial: /dev/ttyS4
baud: 115200
restart_method: command

[static_digital_output ifs_power]
pins: ifs:PB5, !ifs:PB6

# --- Stepper Motors ---

# Feeder Motor (Direct drive gear for pushing/pulling filament)
[manual_stepper ifs_feeder]
step_pin: ifs:PA0
dir_pin: ifs:PA1
enable_pin: !ifs:PA5
microsteps: 16
rotation_distance: 22.5
velocity: 50
accel: 500

# Selector Motor (Channel selector positioning)
[manual_stepper ifs_selector]
step_pin: ifs:PA6
dir_pin: !ifs:PA7
enable_pin: !ifs:PB1
endstop_pin: ^ifs:PB9
microsteps: 16
rotation_distance: 40
velocity: 25
accel: 200

# --- Spool Sensors (Analog ADC Channels) ---

[adc_temperature ifs_raw_adc]
temperature1: 0
voltage1: 0
temperature2: 4095
voltage2: 3.3

[temperature_sensor ifs_spool1_inlet]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PC0
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool1_buffer]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PC1
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool2_inlet]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PC2
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool2_buffer]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PC3
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool3_inlet]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PB12
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool3_buffer]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PB13
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool4_inlet]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PB14
min_temp: -100
max_temp: 10000

[temperature_sensor ifs_spool4_buffer]
sensor_type: ifs_raw_adc
sensor_pin: ifs:PB15
min_temp: -100
max_temp: 10000

# --- Filament Switch Sensors (Virtual Ports mapped to ADC Inlets) ---

[zmod_ifs_switch_sensor ifs_spool_1]
pause_on_runout: False
type: port
port: 1

[zmod_ifs_switch_sensor ifs_spool_2]
pause_on_runout: False
type: port
port: 2

[zmod_ifs_switch_sensor ifs_spool_3]
pause_on_runout: False
type: port
port: 3

[zmod_ifs_switch_sensor ifs_spool_4]
pause_on_runout: False
type: port
port: 4
